name: Prețuri din magazine online
on:
  schedule:
    - cron: "41 1-23/2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["robot/cautare.py", ".github/workflows/cautare.yml"]
concurrency:
  group: preturi-cautare
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  cautare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: cd robot && python cautare.py
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MAX_CAUTARI: "300"
          MAX_TOTAL: "2400"
          MINUTE: "35"
      - name: Salvează
        if: always()
        run: |
          git config user.name "bigmarket-bot"
          git config user.email "bigmarket-bot@users.noreply.github.com"
          git add -A preturi
          git diff --cached --quiet || git commit -q -m "Prețuri din magazine online"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs || true
            (cd robot && python -c "import comun; print(comun.combine())")
            git add preturi.json
            git diff --cached --quiet || git commit -q -m "preturi.json (toate magazinele)"
            git push -q && break
            sleep 9
          done
      # GitHub nu pornește mereu rulările programate în depozitele noi (15.11: niciuna în 3 ore). Dacă mai sunt produse de căutat și
      # n-am atins plafonul gratuit, rularea pornește singură pe următoarea (workflow_dispatch e permis cu GITHUB_TOKEN).
      - name: Rularea următoare
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MORE=$(python - <<'PY'
          import json
          codes = [l.strip() for l in open("coduri.txt") if l.strip()]
          st = json.load(open("preturi/_cautare_stare.json"))
          print(1 if len(st) < 2400 and any(c not in st for c in codes) else 0)
          PY
          )
          if [ "$MORE" = "1" ]; then
            sleep 60
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cautare.yml/dispatches" -d '{"ref":"main"}'
          fi
